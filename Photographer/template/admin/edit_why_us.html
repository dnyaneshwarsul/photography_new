{% include "admin/navbar.html" %}

<style>
    .why-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .why-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .why-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .why-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    .form-control:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .icon-preview-badge {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #FFF5F5;
        border: 1px solid #FECACA;
        color: #EF4444;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-top: 8px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="why-card">
        <!-- HEADER -->
        <div class="why-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Why Choose Us Item
            </h4>
            <a href="/admin/why-us-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Why Us List
            </a>
        </div>

        <!-- FORM -->
        <div class="why-body">
            <form method="POST" action="/admin/edit-why-us/{{ item.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- ICON CLASS -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Bootstrap Icon Class
                        </label>
                        <input type="text" class="form-control" id="icon_class" name="icon_class" value="{{ item.icon_class|default:'bi bi-camera' }}" placeholder="e.g. bi bi-camera, bi bi-lightning">
                        <small class="text-muted">Use standard Bootstrap Icons.</small>
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <span class="text-muted small">Icon Preview:</span>
                            <div class="icon-preview-badge">
                                <i id="iconPreview" class="{{ item.icon_class|default:'bi bi-camera' }}"></i>
                            </div>
                        </div>
                    </div>

                    <!-- CUSTOM ICON IMAGE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Custom Icon Image (Optional)
                        </label>
                        {% if item.icon_image %}
                            <div class="mb-2">
                                <img src="{{ item.icon_image.url }}" alt="{{ item.title }}" style="width: 32px; height: 32px; object-fit: contain;">
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" name="icon_image" accept="image/*">
                        <small class="text-muted">Upload custom PNG/SVG icon.</small>
                    </div>

                    <!-- FEATURE TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Feature Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ item.title }}" placeholder="e.g. Professional, Creative" required>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Description <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="description" rows="3" required>{{ item.description }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/why-us-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Item
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const iconInput = document.getElementById("icon_class");
    const iconPreview = document.getElementById("iconPreview");
    if (iconInput && iconPreview) {
        iconInput.addEventListener("input", function() {
            iconPreview.className = this.value || "bi bi-camera2";
        });
    }
});
</script>
