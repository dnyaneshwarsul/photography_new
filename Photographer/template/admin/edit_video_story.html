{% include "admin/navbar.html" %}

<style>
    .video-form-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .video-form-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .video-form-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .video-form-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    .form-control:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .video-preview {
        width: 100%;
        max-height: 220px;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
        margin-top: 12px;
        background: #000;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="video-form-card">
        <!-- HEADER -->
        <div class="video-form-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Video Story
            </h4>
            <a href="/admin/video-story-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Video Stories List
            </a>
        </div>

        <!-- FORM -->
        <div class="video-form-body">
            <form method="POST" action="/admin/edit-video-story/{{ video_story.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- VIDEO FILE UPLOAD -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Upload New Video File (.mp4, .webm)
                        </label>
                        <input type="file" class="form-control" id="video_file" name="video_file" accept=".mp4,.webm,.mkv">
                        <small class="text-muted">Leave empty to keep existing video.</small>
                        <div>
                            {% if video_story.video_file %}
                                <video id="videoFilePreview" src="{{ video_story.video_file.url }}" class="video-preview" controls></video>
                            {% else %}
                                <video id="videoFilePreview" class="video-preview" controls style="display:none;"></video>
                            {% endif %}
                        </div>
                    </div>

                    <!-- OR VIDEO URL -->
                    <div class="col-md-6">
                        <label class="form-label">
                            OR Video Link / URL
                        </label>
                        <input type="url" class="form-control" name="video_url" value="{{ video_story.video_url|default:'' }}" placeholder="https://example.com/video.mp4">
                        <small class="text-muted">Direct URL to an MP4 video.</small>
                    </div>

                    <!-- CATEGORY TAG -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Category Tag / Subtitle <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="category_tag" value="{{ video_story.category_tag }}" placeholder="e.g. PRE-WEDDING, BIRTHDAY" required>
                    </div>

                    <!-- VIDEO TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Video Story Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ video_story.title }}" placeholder="e.g. Love Before The Wedding" required>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Description <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="description" rows="3" required>{{ video_story.description }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/video-story-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Video Story
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const videoInput = document.getElementById("video_file");
    const videoPreview = document.getElementById("videoFilePreview");
    if (videoInput && videoPreview) {
        videoInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                videoPreview.src = e.target.result;
                videoPreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
