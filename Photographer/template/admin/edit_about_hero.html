{% include "admin/navbar.html" %}

<style>
    .about-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .about-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .about-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .about-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    textarea.form-control {
        height: auto;
    }

    .form-control:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .image-preview {
        max-width: 280px;
        max-height: 180px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
        margin-top: 12px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="about-card">
        <!-- HEADER -->
        <div class="about-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit About Page Top Hero Banner
            </h4>
            <a href="/admin/about-hero-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Hero Banner List
            </a>
        </div>

        <!-- FORM -->
        <div class="about-body">
            <form method="POST" action="/admin/edit-about-hero/{{ about.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- HERO BACKGROUND IMAGE -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Top Hero Background Image
                        </label>
                        <input type="file" class="form-control" id="hero_image" name="hero_image" accept=".jpg,.jpeg,.png,.webp">
                        <small class="text-muted">Leave empty if you don't want to change the image.</small>
                        <div>
                            {% if about.hero_image %}
                                <img id="heroImagePreview" src="{{ about.hero_image.url }}" class="image-preview" alt="Current Hero Image">
                            {% elif about.about_image %}
                                <img id="heroImagePreview" src="{{ about.about_image.url }}" class="image-preview" alt="Current Image">
                            {% else %}
                                <img id="heroImagePreview" class="image-preview" alt="Hero Image Preview" style="display:none;">
                            {% endif %}
                        </div>
                    </div>

                    <!-- HERO SMALL TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Small Label Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="hero_label" value="{{ about.hero_label|default:about.small_title }}" placeholder="e.g. ABOUT ME" required>
                    </div>

                    <!-- HERO MAIN TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Main Heading Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="hero_title" value="{{ about.hero_title|default:about.title }}" placeholder="e.g. Turning Beautiful Moments Into Timeless Memories" required>
                    </div>

                    <!-- HERO DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Hero Description Paragraph <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="hero_description" rows="3" placeholder="Enter banner description..." required>{{ about.hero_description|default:about.description_para1 }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/about-hero-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Hero Banner
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const heroImageInput = document.getElementById("hero_image");
    const heroImagePreview = document.getElementById("heroImagePreview");
    if (heroImageInput && heroImagePreview) {
        heroImageInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                heroImagePreview.src = e.target.result;
                heroImagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
