{% include "admin/navbar.html" %}

<style>
    .gal-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .gal-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .gal-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .gal-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    .form-control:focus, .form-select:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .image-preview {
        max-width: 260px;
        max-height: 220px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
        margin-top: 12px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="gal-card">
        <!-- HEADER -->
        <div class="gal-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Gallery Image
            </h4>
            <a href="/admin/gallery-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Gallery List
            </a>
        </div>

        <!-- FORM -->
        <div class="gal-body">
            <form method="POST" action="/admin/edit-gallery/{{ gallery_item.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- CATEGORY -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Photography Category <span class="required">*</span>
                        </label>
                        <select class="form-select" name="category_name" required>
                            <option value="Wedding" {% if gallery_item.category_name == 'Wedding' %}selected{% endif %}>Wedding (Love & Forever)</option>
                            <option value="Pre-Wedding" {% if gallery_item.category_name == 'Pre-Wedding' %}selected{% endif %}>Pre-Wedding (Couple Stories)</option>
                            <option value="Birthday" {% if gallery_item.category_name == 'Birthday' %}selected{% endif %}>Birthday (Celebration)</option>
                            <option value="Baby & Kids" {% if gallery_item.category_name == 'Baby & Kids' %}selected{% endif %}>Baby & Kids (Little Memories)</option>
                            <option value="Events" {% if gallery_item.category_name == 'Events' %}selected{% endif %}>Events (Special Events)</option>
                            <option value="Fashion" {% if gallery_item.category_name == 'Fashion' %}selected{% endif %}>Fashion (Style & Creativity)</option>
                            <option value="Portrait" {% if gallery_item.category_name == 'Portrait' %}selected{% endif %}>Portrait (Personal Stories)</option>
                        </select>
                    </div>

                    <!-- TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Photo Title (Title) <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ gallery_item.title|default:'' }}" placeholder="e.g. Forever Begins, Beautiful Couple" required>
                    </div>

                    <!-- SUBTITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Subtitle / Sub-Caption (Category Subtitle)
                        </label>
                        <input type="text" class="form-control" name="subtitle" value="{{ gallery_item.subtitle|default:'' }}" placeholder="e.g. Wedding Ceremony, Candid Photography">
                    </div>

                    <!-- GALLERY IMAGE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Gallery Photo / Image
                        </label>
                        <input type="file" class="form-control" id="gallery_image" name="gallery_image" accept=".jpg,.jpeg,.png,.webp">
                        <small class="text-muted">Leave empty if you don't want to change the image.</small>
                        <div>
                            {% if gallery_item.gallery_image %}
                                <img id="galImagePreview" src="{{ gallery_item.gallery_image.url }}" class="image-preview" alt="Current Image">
                            {% else %}
                                <img id="galImagePreview" class="image-preview" alt="Gallery Preview" style="display:none;">
                            {% endif %}
                        </div>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/gallery-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Gallery Image
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const imageInput = document.getElementById("gallery_image");
    const imagePreview = document.getElementById("galImagePreview");
    if (imageInput && imagePreview) {
        imageInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>

{% include "admin/footer.html" %}
