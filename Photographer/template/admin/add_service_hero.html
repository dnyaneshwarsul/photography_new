{% include "admin/navbar.html" %}

<style>
    .service-hero-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
        border: 1px solid #E2E8F0;
    }

    .service-hero-header {
        background: linear-gradient(135deg, #1e1b18 0%, #322824 50%, #8a4f29 100%);
        color: white;
        padding: 24px 30px;
        border-radius: 16px 16px 0 0;
    }

    .service-hero-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.3rem;
        letter-spacing: -0.3px;
    }

    .service-hero-body {
        padding: 35px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        height: 48px;
        border-radius: 10px;
        border: 1.5px solid #CBD5E1;
        font-size: 0.92rem;
        transition: all 0.2s ease;
    }

    textarea.form-control {
        height: auto;
    }

    .form-control:focus {
        border-color: #d97706;
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    .btn-save {
        padding: 12px 34px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.95rem;
        background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
        box-shadow: 0 6px 18px rgba(217, 119, 6, 0.4);
        color: #fff;
    }

    .image-preview {
        max-width: 320px;
        max-height: 200px;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid #e2e8f0;
        display: none;
        margin-top: 12px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="service-hero-card">
        <!-- HEADER -->
        <div class="service-hero-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-camera-fill me-2 text-warning"></i>
                Add Services Page Hero Banner
            </h4>
            <a href="/admin/service-hero-list/" class="btn btn-outline-light btn-sm fw-bold rounded-3">
                <i class="bi bi-list-ul me-1"></i> View Services Hero List
            </a>
        </div>

        <!-- FORM -->
        <div class="service-hero-body">
            <form method="POST" action="/admin/add-service-hero/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- HERO BACKGROUND IMAGE -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Hero Background Image <span class="required">*</span>
                        </label>
                        <input type="file" class="form-control" id="hero_image" name="hero_image" accept=".jpg,.jpeg,.png,.webp" required onchange="previewImage(this)">
                        <small class="text-muted">Recommended: High quality widescreen landscape photo (1920x800px).</small>
                        <div>
                            <img id="heroImagePreview" class="image-preview" alt="Hero Image Preview">
                        </div>
                    </div>

                    <!-- HERO SMALL LABEL -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Top Small Label Text <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="label_text" value="OUR SERVICES" placeholder="e.g. OUR SERVICES" required>
                    </div>

                    <!-- TITLE PREFIX -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Title Prefix Text <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title_prefix" value="Professional " placeholder="e.g. Professional " required>
                    </div>

                    <!-- TITLE HIGHLIGHT -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Title Highlighted Word (Gold Color) <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title_highlight" value="Photography" placeholder="e.g. Photography" required>
                    </div>

                    <!-- TITLE SUFFIX -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Title Suffix Text <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title_suffix" value=" Services" placeholder="e.g.  Services" required>
                    </div>

                    <!-- HERO DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Hero Description Paragraph <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Enter hero description text..." required>We capture your most beautiful moments with creativity, emotion and timeless photography. From weddings and portraits to birthdays, baby shoots and special events.</textarea>
                    </div>

                    <!-- BUTTON TEXT -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Button Text <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="btn_text" value="Explore Our Services" placeholder="e.g. Explore Our Services" required>
                    </div>

                    <!-- BUTTON LINK -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Button Target Link <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="btn_link" value="#services" placeholder="e.g. #services" required>
                    </div>

                    <!-- BOTTOM TEXT -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Bottom Subtitle Text <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="bottom_text" value="CAPTURING MOMENTS • CREATING MEMORIES" placeholder="e.g. CAPTURING MOMENTS • CREATING MEMORIES" required>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-3 border-top">
                        <button type="reset" class="btn btn-light me-2 border fw-bold rounded-3">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Form
                        </button>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Hero Banner
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function previewImage(input) {
        const preview = document.getElementById('heroImagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
