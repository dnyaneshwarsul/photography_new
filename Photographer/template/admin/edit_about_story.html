{% include "admin/navbar.html" %}

<style>
    .about-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .about-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .about-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .about-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    textarea.form-control {
        height: auto;
    }

    .form-control:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .image-preview {
        max-width: 220px;
        max-height: 220px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
        margin-top: 12px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="about-card">
        <!-- HEADER -->
        <div class="about-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Our Story Section Entry
            </h4>
            <a href="/admin/about-story-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Our Story List
            </a>
        </div>

        <!-- FORM -->
        <div class="about-body">
            <form method="POST" action="/admin/edit-about-story/{{ story.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- STORY IMAGE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Our Story Right Side Image
                        </label>
                        <input type="file" class="form-control" id="story_image" name="story_image" accept=".jpg,.jpeg,.png,.webp">
                        <small class="text-muted">Leave empty if you don't want to change the image.</small>
                        <div>
                            {% if story.story_image %}
                                <img id="storyImagePreview" src="{{ story.story_image.url }}" class="image-preview" alt="Current Image">
                            {% else %}
                                <img id="storyImagePreview" class="image-preview" alt="Story Image Preview" style="display:none;">
                            {% endif %}
                        </div>
                    </div>

                    <!-- BADGE INFO -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Badge Main Title <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" name="photographer_name" value="{{ story.photographer_name }}" placeholder="e.g. Your Photographer" required>
                        </div>
                        <div>
                            <label class="form-label">
                                Badge Subtitle <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" name="badge_subtitle" value="{{ story.badge_subtitle }}" placeholder="e.g. The Journey Begins" required>
                        </div>
                    </div>

                    <!-- SUB-TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Section Sub-Title (Small Badge Title) <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="small_title" value="{{ story.small_title }}" placeholder="e.g. OUR STORY" required>
                    </div>

                    <!-- MAIN TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Main Heading Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ story.title }}" placeholder="e.g. Turning Beautiful Moments Into Timeless Memories" required>
                    </div>

                    <!-- DESCRIPTION PARAGRAPH 1 -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Description Paragraph 1 <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="description_para1" rows="3" placeholder="Enter first paragraph..." required>{{ story.description_para1 }}</textarea>
                    </div>

                    <!-- DESCRIPTION PARAGRAPH 2 -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Description Paragraph 2
                        </label>
                        <textarea class="form-control" name="description_para2" rows="3" placeholder="Enter second paragraph...">{{ story.description_para2 }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/about-story-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Our Story Entry
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const storyImageInput = document.getElementById("story_image");
    const storyImagePreview = document.getElementById("storyImagePreview");
    if (storyImageInput && storyImagePreview) {
        storyImageInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                storyImagePreview.src = e.target.result;
                storyImagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
