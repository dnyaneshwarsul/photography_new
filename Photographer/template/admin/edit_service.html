{% include "admin/navbar.html" %}

<style>
    .service-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .service-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .service-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .service-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    textarea.form-control {
        height: auto;
    }

    .form-control:focus, .form-select:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="service-card">
        <!-- HEADER -->
        <div class="service-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Photography Service
            </h4>
            <a href="/admin/service-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Services List
            </a>
        </div>

        <!-- FORM -->
        <div class="service-body">
            <form method="POST" action="/admin/edit-service/{{ service.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- SERVICE TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Service Title / Name <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ service.title }}" placeholder="e.g. Wedding, Portrait, Pre-Wedding, Events" required>
                    </div>

                    <!-- ICON CLASS & PREVIEW -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Bootstrap Icon Class <span class="required">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i id="iconPreview" class="{{ service.icon_class }} text-danger"></i>
                            </span>
                            <input type="text" class="form-control" id="icon_class" name="icon_class" value="{{ service.icon_class }}" placeholder="e.g. bi bi-heart, bi bi-camera, bi bi-stars" required>
                        </div>
                        <small class="text-muted">Enter any Bootstrap icon class (e.g. bi bi-heart, bi bi-camera, bi bi-stars)</small>
                    </div>

                    <!-- SERVICE IMAGE UPLOAD -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Service Image
                        </label>
                        <input type="file" class="form-control" name="service_image" accept="image/*">
                        {% if service.service_image %}
                            <div class="mt-2">
                                <small class="text-muted d-block mb-1">Current Image:</small>
                                <img src="{{ service.service_image.url }}" style="max-width:200px; max-height:120px; border-radius:8px; border:1px solid #ddd;" alt="Service Image">
                            </div>
                        {% endif %}
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Service Short Description <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Enter short service description paragraph..." required>{{ service.description }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/service-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Service
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const iconInput = document.getElementById("icon_class");
    const iconPreview = document.getElementById("iconPreview");
    if (iconInput && iconPreview) {
        iconInput.addEventListener("input", function() {
            iconPreview.className = (this.value || "bi bi-heart") + " text-danger";
        });
    }
});
</script>
