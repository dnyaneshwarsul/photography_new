{% include "admin/navbar.html" %}

<style>
    .slider-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .slider-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .slider-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .slider-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    textarea.form-control {
        height: auto;
    }

    .form-control:focus, .form-select:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .image-preview {
        max-width: 100%;
        max-height: 220px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
        margin-top: 12px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="slider-card">
        <!-- HEADER -->
        <div class="slider-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Home Page Hero Slider
            </h4>
            <a href="/admin/slider-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Slider List
            </a>
        </div>

        <!-- FORM -->
        <div class="slider-body">
            <form method="POST" action="/admin/edit-slider/{{ slider.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- SLIDER IMAGE -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Hero Background Image
                        </label>
                        <input type="file" class="form-control" id="slider_image" name="slider_image" accept=".jpg,.jpeg,.png,.webp">
                        <small class="text-muted">Leave empty if you don't want to change the image.</small>
                        <div>
                            {% if slider.slider_image %}
                                <img id="sliderImagePreview" src="{{ slider.slider_image.url }}" class="image-preview" alt="Current Slider Image">
                            {% else %}
                                <img id="sliderImagePreview" class="image-preview" alt="Slider Preview" style="display:none;">
                            {% endif %}
                        </div>
                    </div>

                    <!-- TAGLINE & ICON -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Sub-Tagline Text <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="tagline" value="{{ slider.tagline }}" placeholder="e.g. A2Z PHOTOGRAPHERS" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Tagline Icon Class (Bootstrap Icon)
                        </label>
                        <input type="text" class="form-control" name="icon_class" value="{{ slider.icon_class }}" placeholder="e.g. bi bi-camera-fill or bi bi-heart-fill">
                    </div>

                    <!-- HEADING LINE 1 -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Main Heading Line 1 <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title_line1" value="{{ slider.title_line1 }}" placeholder="e.g. Your Story." required>
                    </div>

                    <!-- HEADING LINE 2 PREFIX & HIGHLIGHT -->
                    <div class="col-md-3">
                        <label class="form-label">
                            Heading Line 2 Prefix
                        </label>
                        <input type="text" class="form-control" name="title_line2_prefix" value="{{ slider.title_line2_prefix }}" placeholder="e.g. Our ">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">
                            Heading Line 2 Highlight (Italicized) <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title_line2_highlight" value="{{ slider.title_line2_highlight }}" placeholder="e.g. Lens." required>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Sub-Description Paragraph
                        </label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Enter slider description paragraph...">{{ slider.description }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/slider-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Home Slider
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const sliderImageInput = document.getElementById("slider_image");
    const sliderImagePreview = document.getElementById("sliderImagePreview");
    if (sliderImageInput && sliderImagePreview) {
        sliderImageInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                sliderImagePreview.src = e.target.result;
                sliderImagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
