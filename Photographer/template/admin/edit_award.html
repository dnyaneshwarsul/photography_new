{% include "admin/navbar.html" %}

<style>
    .award-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .award-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .award-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .award-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    .form-control:focus, .form-select:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="award-card">
        <!-- HEADER -->
        <div class="award-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Award & Recognition
            </h4>
            <a href="/admin/award-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> View Awards List
            </a>
        </div>

        <!-- FORM -->
        <div class="award-body">
            <form method="POST" action="/admin/edit-award/{{ award.id }}/">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- ICON CLASS -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Bootstrap Icon Class <span class="required">*</span>
                        </label>
                        <select class="form-select" name="icon_class" required>
                            <option value="bi bi-trophy" {% if award.icon_class == "bi bi-trophy" %}selected{% endif %}>bi bi-trophy (Trophy Icon)</option>
                            <option value="bi bi-award" {% if award.icon_class == "bi bi-award" %}selected{% endif %}>bi bi-award (Award Badge Icon)</option>
                            <option value="bi bi-star" {% if award.icon_class == "bi bi-star" %}selected{% endif %}>bi bi-star (Star Icon)</option>
                            <option value="bi bi-patch-check" {% if award.icon_class == "bi bi-patch-check" %}selected{% endif %}>bi bi-patch-check (Verified Badge)</option>
                            <option value="bi bi-camera" {% if award.icon_class == "bi bi-camera" %}selected{% endif %}>bi bi-camera (Camera Icon)</option>
                        </select>
                    </div>

                    <!-- AWARD TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Award Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ award.title }}" required>
                    </div>

                    <!-- SUBTITLE / ORGANIZER / YEAR -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Subtitle / Awarding Body / Year <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="subtitle" value="{{ award.subtitle }}" required>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/award-list/" class="btn btn-light me-2 border font-weight-bold">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Award
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% include "admin/footer.html" %}
