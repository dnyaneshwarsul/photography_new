{% include "admin/navbar.html" %}

<style>
    .process-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .process-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .process-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .process-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    .form-control:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .icon-preview-badge {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #1A1A1A;
        color: #B2875B;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        margin-top: 4px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="process-card">
        <!-- HEADER -->
        <div class="process-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Process Step
            </h4>
            <a href="/admin/process-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Process List
            </a>
        </div>

        <!-- FORM -->
        <div class="process-body">
            <form method="POST" action="/admin/edit-process/{{ process.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- STEP NUMBER -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Step Number <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="step_number" value="{{ process.step_number }}" placeholder="e.g. 01, 02, 03" required>
                    </div>

                    <!-- STEP TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Step Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ process.title }}" placeholder="e.g. Consultation, Planning" required>
                    </div>

                    <!-- ICON CLASS -->
                    <div class="col-md-8">
                        <label class="form-label">
                            Icon Class (Bootstrap Icon)
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="iconInput"
                               name="icon_class" 
                               value="{{ process.icon_class|default:'' }}" 
                               placeholder="e.g. bi bi-chat-heart, bi bi-calendar-check"
                               oninput="updateIconPreview(this.value)">
                    </div>

                    <!-- ICON PREVIEW -->
                    <div class="col-md-4 text-center">
                        <label class="form-label d-block">Icon Preview</label>
                        <div class="icon-preview-badge" id="iconPreview">
                            <i class="{{ process.icon_class|default:'bi bi-chat-heart' }}"></i>
                        </div>
                    </div>

                    <!-- CUSTOM ICON IMAGE UPLOAD -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Custom Icon Image (Optional)
                        </label>
                        {% if process.icon_image %}
                            <div class="mb-2">
                                <img src="{{ process.icon_image.url }}" alt="{{ process.title }}" style="width: 40px; height: 40px; object-fit: contain;" class="rounded border p-1 bg-dark">
                                <span class="small text-muted ms-2">Current Custom Image</span>
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" name="icon_image" accept="image/*">
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Description <span class="required">*</span>
                        </label>
                        <textarea class="form-control" name="description" rows="3" required>{{ process.description }}</textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/process-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Step
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function updateIconPreview(val) {
        const preview = document.getElementById('iconPreview');
        if (val.trim() !== '') {
            preview.innerHTML = '<i class="' + val + '"></i>';
        } else {
            preview.innerHTML = '<i class="bi bi-chat-heart"></i>';
        }
    }
</script>
