{% include "admin/navbar.html" %}

<style>
    .featured-card {
        width: 100%;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #E2E8F0;
    }

    .featured-header {
        background: linear-gradient(135deg, #1a0000 0%, #2d0000 60%, #450a0a 100%);
        color: white;
        padding: 22px 28px;
        border-radius: 14px 14px 0 0;
    }

    .featured-header h4 {
        margin: 0;
        font-weight: 800;
        font-size: 1.25rem;
    }

    .featured-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 700;
        color: #0F172A;
        font-size: 0.88rem;
        margin-bottom: 8px;
    }

    .form-control {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        font-size: 0.9rem;
    }

    .form-control:focus {
        border-color: #EF4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn-save {
        padding: 11px 32px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        transition: all 0.2s ease;
    }

    .btn-save:hover {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        color: #fff;
    }

    .image-preview {
        max-width: 100%;
        max-height: 220px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
        margin-top: 12px;
    }

    .required {
        color: #EF4444;
    }
</style>

<div class="container-fluid">
    <div class="featured-card">
        <!-- HEADER -->
        <div class="featured-header d-flex justify-content-between align-items-center">
            <h4>
                <i class="bi bi-pencil-square me-2 text-danger"></i>
                Edit Featured Work
            </h4>
            <a href="/admin/featured-list/" class="btn btn-outline-light btn-sm font-weight-bold">
                <i class="bi bi-list-ul me-1"></i> Back to Featured List
            </a>
        </div>

        <!-- FORM -->
        <div class="featured-body">
            <form method="POST" action="/admin/edit-featured/{{ featured.id }}/" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- WORK IMAGE -->
                    <div class="col-md-12">
                        <label class="form-label">
                            Featured Photo / Work Image
                        </label>
                        <input type="file" class="form-control" id="work_image" name="work_image" accept=".jpg,.jpeg,.png,.webp">
                        <small class="text-muted">Leave empty if you don't want to change the image.</small>
                        <div>
                            {% if featured.work_image %}
                                <img id="workImagePreview" src="{{ featured.work_image.url }}" class="image-preview" alt="Current Work Image">
                            {% else %}
                                <img id="workImagePreview" class="image-preview" alt="Work Image Preview" style="display:none;">
                            {% endif %}
                        </div>
                    </div>

                    <!-- TITLE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Featured Title <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="title" value="{{ featured.title }}" placeholder="e.g. Forever Begins, Love Story" required>
                    </div>

                    <!-- CATEGORY NAME -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Category / Subtitle <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" name="category_name" value="{{ featured.category_name }}" placeholder="e.g. Wedding Photography, Pre-Wedding Photography" required>
                    </div>

                    <!-- BUTTONS -->
                    <div class="col-12 text-end mt-4 pt-2 border-top">
                        <a href="/admin/featured-list/" class="btn btn-light me-2 border font-weight-bold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-save">
                            <i class="bi bi-check-circle me-1"></i> Update Featured Work
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const imageInput = document.getElementById("work_image");
    const imagePreview = document.getElementById("workImagePreview");
    if (imageInput && imagePreview) {
        imageInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
